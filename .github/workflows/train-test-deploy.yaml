name: Train-Test-Deploy Azure ML

on:
  repository_dispatch:
    types: [trigger-mlops-pipeline]

permissions:
  id-token: write
  contents: read

jobs:
  aml-mlops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Install Azure ML CLI
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add -n ml -y

      - name: Train the model
        run: |
          az ml job create --file jobs/train.yaml --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --workspace-name ${{ secrets.AZURE_WORKSPACE }}

      - name: Test the model
        run: |
          az ml job create --file jobs/test.yaml --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --workspace-name ${{ secrets.AZURE_WORKSPACE }}

      - name: Deploy the model
        run: |
          az ml job create --file jobs/deploy.yaml --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --workspace-name ${{ secrets.AZURE_WORKSPACE }}